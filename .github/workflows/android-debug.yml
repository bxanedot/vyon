name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - build/android-debug-apk

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-debug:
    name: Build and test dev debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install Android SDK packages
        shell: bash
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" >> local.properties
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            --channel=3 \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Run tests and assemble dev debug APKs
        run: ./gradlew :app:testDevDebugUnitTest :app:assembleDevDebug --console=plain

      - name: Verify APK outputs
        shell: bash
        run: |
          set -euo pipefail
          find android/app/build/outputs/apk/dev/debug -maxdepth 1 -type f -name '*.apk' -print
          test -n "$(find android/app/build/outputs/apk/dev/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload installable debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: vyon-dev-debug-apks
          path: android/app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
          retention-days: 14
