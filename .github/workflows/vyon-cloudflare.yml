name: Deploy Vyon website and Listen Together

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/vyon-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vyon-website-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment credentials
        id: credentials
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [[ -n "$CF_ACCOUNT" && -n "$CF_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Add CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN to GitHub Actions secrets to activate deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy site and room server together
        if: steps.credentials.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          command: deploy
